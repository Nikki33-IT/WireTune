name: 💡 Feature Request
description: Propose a new feature, adapter optimization, or enhancement for WireTune
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        WireTune is built on the core values of **Safety**, **Privacy**, and **Lightweight Performance**. Please describe your idea and how it fits these principles.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a specific problem?
      description: A clear and concise description of the limitation or use case.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any hardware context, driver documentation links, or references.
    validations:
      required: false
