name: WireTune CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Verify Dependencies & Structure
      run: |
        node --version
        npm --version

    - name: Run Test Suite
      run: npm test

    - name: Validate Localization JSON Files
      shell: pwsh
      run: |
        $files = Get-ChildItem -Path "locales" -Filter "*.json"
        foreach ($f in $files) {
          $content = Get-Content $f.FullName -Raw | ConvertFrom-Json
          if (-not $content.appName) {
            Write-Error "Invalid locale file: $($f.Name)"
            exit 1
          }
        }
        Write-Host "All $($files.Count) locale files are valid JSON."
